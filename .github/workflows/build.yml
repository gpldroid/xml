name: Build Blogger Theme

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'

concurrency:
  group: blogger-theme-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate theme
        run: npm run validate

      - name: Build theme
        run: npm run build

      - name: Commit generated theme and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json dist/theme.xml
          git diff --cached --quiet || git commit -m "chore: build Blogger theme"
          git push
